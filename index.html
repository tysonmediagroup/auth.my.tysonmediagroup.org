<!DOCTYPE html>
<html lang="en" data-theme="noir-aero">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | myTYSON Authentication</title>
  <link rel="icon" type="image/png" href="/assets/myTYSONIcon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="/sdk/mytyson.js"></script>
</head>
<body class="auth-page-body">
  <div class="auth-center-wrap">
    <div class="auth-box">
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
        <button type="button" id="themeToggleBtn" class="settings-toggle-btn" style="font-size:0.78rem;padding:6px 12px;">Theme</button>
      </div>

      <div class="auth-logo-wrap">
        <img src="/assets/MyTYSONBanner.png" alt="myTYSON" class="auth-banner-logo" />
        <p class="editorial-tag" style="margin-top:8px;">PERSPECTIVE IN MOTION</p>
        <h1 class="auth-heading" id="authHeading">myTYSON Identity</h1>
        <p class="auth-subheading" id="authSubheading">Unified Encrypted Single Sign-On across TYSON Media Group</p>
        <div id="authTargetPill" class="auth-target-pill" style="display:none;"></div>
      </div>

      <div id="authContinueBox" class="auth-continue-box">
        <div style="font-weight:600;margin-bottom:6px;" id="continueLabel">Already signed in</div>
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:14px;" id="continueMeta"></div>
        <div class="action-row" style="gap:10px;justify-content:center;flex-wrap:wrap;">
          <button type="button" id="continueRedirectBtn" class="btn btn-primary">Continue</button>
          <button type="button" id="switchAccountBtn" class="btn">Switch Account</button>
        </div>
      </div>

      <div id="authErrorBox" class="auth-error" role="alert"></div>

      <div id="authTabsRow" class="auth-nav-tabs" role="tablist">
        <button type="button" class="auth-nav-tab active" data-auth-tab="login">Sign In</button>
        <button type="button" class="auth-nav-tab" data-auth-tab="register">Create Account</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="loginIdentifier">Handle, Email, or Staff ID</label>
          <input id="loginIdentifier" class="form-input" type="text" required autocomplete="username" placeholder="username or handle@tysonmediagroup.org" />
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input id="loginPassword" class="form-input" type="password" required autocomplete="current-password" placeholder="Enter your password" />
        </div>
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width:100%;margin-top:6px;">Sign In</button>

        <div style="text-align:center;margin:18px 0 12px;font-size:0.78rem;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;">
          Or Continue With Google
        </div>
        <div id="googleSignInContainer" style="display:flex;justify-content:center;min-height:44px;"></div>
      </form>

      <form id="registerForm" style="display:none;" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="regUsername">Handle / Username</label>
          <input id="regUsername" class="form-input" type="text" required minlength="2" maxlength="64" placeholder="your.handle" />
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="regFirstName">First Name</label>
            <input id="regFirstName" class="form-input" type="text" required maxlength="60" placeholder="First" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regLastName">Last Name</label>
            <input id="regLastName" class="form-input" type="text" required maxlength="60" placeholder="Last" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="regDivision">Division / Interest</label>
          <input id="regDivision" class="form-input" type="text" maxlength="80" value="Community Network" />
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Password (min 8 characters)</label>
          <input id="regPassword" class="form-input" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" />
        </div>
        <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
          <span class="form-label" style="margin:0;">Show Real Name Publicly</span>
          <label class="switch-toggle">
            <input id="regShowRealName" type="checkbox" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="form-group" style="display:flex;flex-direction:column;align-items:center;">
          <div id="turnstileSignupWidget"></div>
          <div id="turnstileStatusMsg" style="font-size:0.78rem;color:var(--text-muted);text-align:center;margin-top:6px;"></div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width:100%;">Create Encrypted Account</button>
      </form>

      <form id="onboardingForm" style="display:none;" autocomplete="off">
        <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:16px;">
          Choose your public myTYSON handle to finish linking your verified Google account.
        </p>
        <div class="form-group">
          <label class="form-label" for="onboardUsername">Choose Handle</label>
          <input id="onboardUsername" class="form-input" type="text" required minlength="2" maxlength="64" placeholder="your.handle" />
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="onboardFirstName">First Name</label>
            <input id="onboardFirstName" class="form-input" type="text" required maxlength="60" />
          </div>
          <div class="form-group">
            <label class="form-label" for="onboardLastName">Last Name</label>
            <input id="onboardLastName" class="form-input" type="text" required maxlength="60" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="onboardDivision">Division</label>
          <input id="onboardDivision" class="form-input" type="text" maxlength="80" value="Community Network" />
        </div>
        <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
          <span class="form-label" style="margin:0;">Show Real Name Publicly</span>
          <label class="switch-toggle">
            <input id="onboardShowRealName" type="checkbox" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <button type="submit" id="onboardSubmitBtn" class="btn btn-primary" style="width:100%;">Complete Google Registration</button>
      </form>
    </div>
  </div>

  <div id="themeDrawerBackdrop" class="settings-drawer-backdrop"></div>
  <aside id="themeDrawer" class="settings-drawer" aria-label="Appearance settings">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="font-family:var(--font-editorial);font-size:1.4rem;margin:0;">Theme</h2>
      <button type="button" id="closeThemeDrawerBtn" class="btn">Close</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button type="button" class="theme-option-btn" data-theme-option="noir-aero">Black Frutiger Aero (Default)</button>
      <button type="button" class="theme-option-btn" data-theme-option="noir">Noir Midnight</button>
      <button type="button" class="theme-option-btn" data-theme-option="frutiger">Frutiger Aqua</button>
      <button type="button" class="theme-option-btn" data-theme-option="wii">Wii Channel</button>
      <button type="button" class="theme-option-btn" data-theme-option="nature">Nature Obsidian</button>
    </div>
  </aside>

  <script>
    (function () {
      "use strict";
      const core = window.MyTysonCore;
      const params = new URLSearchParams(window.location.search);
      const rawRedirect = params.get("redirect");
      let pendingOnboardingToken = null;
      let turnstileToken = "";
      let turnstileWidgetId = null;

      function isSafeDestination(urlStr) {
        if (!urlStr) return false;
        try {
          const u = new URL(urlStr);
          const h = u.hostname.toLowerCase();
          if (u.protocol === "http:" && (h === "localhost" || h === "127.0.0.1")) return true;
          if (u.protocol !== "https:") return false;
          return h === "tysonmediagroup.org" || h.endsWith(".tysonmediagroup.org") || h === "tysonmediagroup.org.myt5s.app";
        } catch (_) {
          return false;
        }
      }

      const redirectUrl = isSafeDestination(rawRedirect) ? rawRedirect : core.getDashboardOrigin();
      if (isSafeDestination(rawRedirect)) {
        const pill = document.getElementById("authTargetPill");
        pill.textContent = "Redirecting to " + new URL(redirectUrl).hostname;
        pill.style.display = "inline-flex";
      }

      function showError(msg) {
        const el = document.getElementById("authErrorBox");
        if (!msg) {
          el.textContent = "";
          el.classList.remove("visible");
          return;
        }
        el.textContent = msg;
        el.classList.add("visible");
      }

      function setTab(mode) {
        showError("");
        document.getElementById("onboardingForm").style.display = "none";
        document.getElementById("authTabsRow").style.display = "flex";
        document.querySelectorAll("[data-auth-tab]").forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-auth-tab") === mode);
        });
        document.getElementById("loginForm").style.display = mode === "login" ? "block" : "none";
        document.getElementById("registerForm").style.display = mode === "register" ? "block" : "none";
        if (mode === "register") renderTurnstile();
      }

      document.querySelectorAll("[data-auth-tab]").forEach((btn) => {
        btn.addEventListener("click", () => setTab(btn.getAttribute("data-auth-tab")));
      });

      function renderTurnstile() {
        const statusEl = document.getElementById("turnstileStatusMsg");
        const container = document.getElementById("turnstileSignupWidget");
        const cfg = core.getConfig();
        if (!cfg.turnstileSiteKey) {
          statusEl.textContent = "Human verification will enforce Cloudflare Turnstile once TURNSTILE_SITE_KEY is configured.";
          return;
        }
        if (!window.turnstile || turnstileWidgetId !== null) return;
        statusEl.textContent = "";
        turnstileWidgetId = window.turnstile.render(container, {
          sitekey: cfg.turnstileSiteKey,
          action: "signup",
          theme: "dark",
          callback: function (token) {
            turnstileToken = token || "";
          },
          "expired-callback": function () {
            turnstileToken = "";
          },
          "error-callback": function () {
            turnstileToken = "";
            showError("Turnstile verification encountered an error. Please retry.");
          }
        });
      }

      async function completeAuthNavigation() {
        const dest = await core.buildPostAuthRedirectUrl(redirectUrl);
        window.location.href = dest;
      }

      function initGoogleWidget() {
        const container = document.getElementById("googleSignInContainer");
        const cfg = core.getConfig();
        if (!container || !cfg.googleClientId || !window.google?.accounts?.id) return;
        container.innerHTML = "";
        window.google.accounts.id.initialize({
          client_id: cfg.googleClientId,
          callback: async (resp) => {
            if (!resp?.credential) return;
            showError("");
            const res = await core.googleAuth("login", resp.credential);
            if (res.ok && res.session) {
              await completeAuthNavigation();
              return;
            }
            if (res.ok && res.needsOnboarding) {
              pendingOnboardingToken = res.onboardingToken;
              document.getElementById("authTabsRow").style.display = "none";
              document.getElementById("loginForm").style.display = "none";
              document.getElementById("registerForm").style.display = "none";
              document.getElementById("onboardingForm").style.display = "block";
              document.getElementById("onboardFirstName").value = res.suggestedFirstName || "";
              document.getElementById("onboardLastName").value = res.suggestedLastName || "";
              return;
            }
            showError(res.error || "Google sign-in failed.");
          }
        });
        window.google.accounts.id.renderButton(container, {
          type: "standard",
          theme: "filled_black",
          size: "large",
          text: "continue_with",
          shape: "pill",
          width: 300
        });
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const btn = document.getElementById("loginSubmitBtn");
        btn.disabled = true;
        try {
          const res = await core.authenticate(
            document.getElementById("loginIdentifier").value,
            document.getElementById("loginPassword").value
          );
          if (res.ok && res.session) {
            await completeAuthNavigation();
          } else {
            showError(res.error || "Invalid handle or password.");
          }
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const cfg = core.getConfig();
        if (cfg.turnstileSiteKey && !turnstileToken) {
          showError("Please complete the Cloudflare Turnstile verification check.");
          return;
        }
        const btn = document.getElementById("regSubmitBtn");
        btn.disabled = true;
        try {
          const res = await core.registerAccount({
            username: document.getElementById("regUsername").value,
            firstName: document.getElementById("regFirstName").value,
            lastName: document.getElementById("regLastName").value,
            division: document.getElementById("regDivision").value,
            password: document.getElementById("regPassword").value,
            showRealName: document.getElementById("regShowRealName").checked,
            turnstileToken
          });
          if (res.ok && res.session) {
            await completeAuthNavigation();
          } else {
            showError(res.error || "Registration failed.");
          }
        } finally {
          btn.disabled = false;
          turnstileToken = "";
          if (window.turnstile && turnstileWidgetId !== null) {
            try { window.turnstile.reset(turnstileWidgetId); } catch (_) {}
          }
        }
      });

      document.getElementById("onboardingForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const btn = document.getElementById("onboardSubmitBtn");
        btn.disabled = true;
        try {
          const res = await core.completeGoogleOnboarding({
            onboardingToken: pendingOnboardingToken,
            username: document.getElementById("onboardUsername").value,
            firstName: document.getElementById("onboardFirstName").value,
            lastName: document.getElementById("onboardLastName").value,
            division: document.getElementById("onboardDivision").value,
            showRealName: document.getElementById("onboardShowRealName").checked
          });
          if (res.ok && res.session) {
            await completeAuthNavigation();
          } else {
            showError(res.error || "Could not complete registration.");
          }
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("continueRedirectBtn").addEventListener("click", completeAuthNavigation);
      document.getElementById("switchAccountBtn").addEventListener("click", async () => {
        await core.logout();
        document.getElementById("authContinueBox").classList.remove("visible");
        setTab("login");
      });

      core.initThemeDrawer();
      if (params.get("mode") === "register") {
        setTab("register");
      }

      core.ready().then((session) => {
        initGoogleWidget();
        if (document.getElementById("registerForm").style.display === "block") {
          renderTurnstile();
        }
        if (session) {
          document.getElementById("continueLabel").textContent = "Signed in as @" + session.slug;
          document.getElementById("continueMeta").textContent = (session.name || session.slug) + " · " + (session.badge || "Member");
          document.getElementById("authContinueBox").classList.add("visible");
        }
      });

      window.addEventListener("load", () => {
        initGoogleWidget();
        if (document.getElementById("registerForm").style.display === "block") {
          renderTurnstile();
        }
      });
    })();
  </script>
</body>
</html>
